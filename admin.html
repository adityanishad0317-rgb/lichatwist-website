<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LichaTwist Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
    }

    header p {
      margin: 6px 0 0;
      color: #cbd5e1;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 22px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      cursor: pointer;
      margin-top: 18px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .save {
      background: #059669;
    }

    .save:hover {
      background: #047857;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #ecfdf5;
      color: #065f46;
    }

    .error {
      background: #fef2f2;
      color: #991b1b;
    }

    .status {
      color: #059669;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>LichaTwist Admin Panel</h1>
  <p>Secure Owner Dashboard</p>
</header>

<main class="container">

  <section class="box">
    <h2>Website Status</h2>
    <p class="status">● Website Online</p>
    <p class="status">● Admin Protected</p>

    <button onclick="openWebsite()">
      Open Public Website
    </button>
  </section>

  <section class="box">

    <h2>📝 Website Content</h2>

    <p>
      Edit your business information below and click
      <strong>Save Changes</strong>.
    </p>

    <label for="businessName">
      Business Name
    </label>

    <input
      id="businessName"
      type="text"
      placeholder="Business name"
    >

    <label for="phone">
      Phone Number
    </label>

    <input
      id="phone"
      type="text"
      placeholder="Phone number"
    >

    <label for="email">
      Email Address
    </label>

    <input
      id="email"
      type="email"
      placeholder="Email address"
    >

    <label for="address">
      Address
    </label>

    <textarea
      id="address"
      placeholder="Business address">
    </textarea>

    <label for="about">
      About / Company Description
    </label>

    <textarea
      id="about"
      placeholder="Company description">
    </textarea>

    <button
      class="save"
      onclick="saveContent()">
      Save Changes
    </button>

    <div
      id="message"
      class="message">
    </div>

  </section>

</main>

<footer>
  LichaTwist Website • Owner Administration Panel
</footer>

<script>

async function loadContent() {

  const message =
    document.getElementById("message");

  try {

    const response =
      await fetch("/api/content");

    const data =
      await response.json();

    if (!response.ok || !data.success) {
      throw new Error("Unable to load content.");
    }

    const content =
      data.content || {};

    document.getElementById(
      "businessName"
    ).value =
      content.business_name || "";

    document.getElementById(
      "phone"
    ).value =
      content.phone || "";

    document.getElementById(
      "email"
    ).value =
      content.email || "";

    document.getElementById(
      "address"
    ).value =
      content.address || "";

    document.getElementById(
      "about"
    ).value =
      content.about || "";

  } catch (error) {

    message.style.display = "block";
    message.className = "message error";
    message.textContent =
      "Unable to load saved information.";

  }
}


async function saveContent() {

  const message =
    document.getElementById("message");

  const data = {

    businessName:
      document.getElementById(
        "businessName"
      ).value,

    phone:
      document.getElementById(
        "phone"
      ).value,

    email:
      document.getElementById(
        "email"
      ).value,

    address:
      document.getElementById(
        "address"
      ).value,

    about:
      document.getElementById(
        "about"
      ).value
  };


  message.style.display = "block";
  message.className = "message";
  message.textContent =
    "Saving...";


  try {

    const response =
      await fetch(
        "/api/content",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(data)
        }
      );


    const result =
      await response.json();


    if (!response.ok || !result.success) {
      throw new Error(
        result.message ||
        "Unable to save."
      );
    }


    message.className =
      "message";

    message.textContent =
      "✓ Changes saved successfully.";

  } catch (error) {

    message.className =
      "message error";

    message.textContent =
      "Unable to save changes.";

  }

}


function openWebsite() {

  window.open(
    "https://lichatwist-website.pages.dev",
    "_blank"
  );

}


loadContent();

</script>

</body>
  </html>
